// ===== Input.js =====
const Input = {
  keys: {},
  init() {
    window.addEventListener('keydown', (e) => this.keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => this.keys[e.key.toLowerCase()] = false);
  },
  isPressed(key) {
    return !!this.keys[key];
  }
};


// ===== CameraManager.js =====
class CameraManager {
  constructor(camera, player) {
    this.camera = camera;
    this.player = player;
    this.mode = 1; // 1: 3ª Pessoa, 2: Top-Down, 3: 1ª Pessoa
  }

  toggleMode() {
    this.mode = this.mode === 1 ? 2 : (this.mode === 2 ? 3 : 1);
    return this.mode;
  }

  update() {
    const pos = this.player.group.position;
    
    if (this.mode === 1) {
      this.camera.position.set(pos.x, 18, pos.z + 14);
      this.camera.lookAt(pos);
    } else if (this.mode === 2) {
      this.camera.position.set(pos.x, 35, pos.z + 1);
      this.camera.lookAt(pos);
    } else if (this.mode === 3) {
      const rotY = this.player.group.rotation.y;
      const dirX = Math.sin(rotY);
      const dirZ = Math.cos(rotY);
      this.camera.position.set(pos.x + dirX * 0.3, pos.y + 2.4, pos.z + dirZ * 0.3);
      this.camera.lookAt(this.camera.position.x + dirX, this.camera.position.y, this.camera.position.z + dirZ);
    }
  }
}


// ===== LightManager.js =====

class LightManager {
  constructor(scene) {
    const { ambient, hemi, moon } = Config.LIGHTS;

    // Luz ambiente para preenchimento de penumbra
    this.ambientLight = new THREE.AmbientLight(ambient.color, ambient.intensity);
    scene.add(this.ambientLight);

    // Hemisfério (gradiente teto/chão)
    this.hemiLight = new THREE.HemisphereLight(hemi.sky, hemi.ground, hemi.intensity);
    scene.add(this.hemiLight);

    // Luz noturna direcional com projeção de sombras
    this.moonLight = new THREE.DirectionalLight(moon.color, moon.intensity);
    this.moonLight.position.set(...moon.pos);
    this.moonLight.castShadow = true;
    this.moonLight.shadow.mapSize.set(1024, 1024);
    this.moonLight.shadow.camera.left = -20;
    this.moonLight.shadow.camera.right = 20;
    this.moonLight.shadow.camera.top = 20;
    this.moonLight.shadow.camera.bottom = -20;
    this.moonLight.shadow.camera.near = 0.5;
    this.moonLight.shadow.camera.far = 50;
    this.moonLight.shadow.bias = -0.0005;
    scene.add(this.moonLight);
    scene.add(this.moonLight.target);
  }

  toggle(lightType) {
    if (lightType === 'ambient') this.ambientLight.visible = !this.ambientLight.visible;
    if (lightType === 'hemi') this.hemiLight.visible = !this.hemiLight.visible;
    if (lightType === 'moon') this.moonLight.visible = !this.moonLight.visible;
  }
}

// ===== LevelMap.js =====

class LevelMap {
  constructor(scene) {
    this.scene = scene;
    this.blockSize = Config.LEVEL.blockSize;
    this.grid = Config.LEVEL.grid;
    this.wallsBoxes = [];
    this.textureLoader = new THREE.TextureLoader();
  }

  cellToWorld(r, c) {
    const rows = this.grid.length;
    const cols = this.grid[0].length;
    const offsetX = -(cols * this.blockSize) / 2 + this.blockSize / 2;
    const offsetZ = -(rows * this.blockSize) / 2 + this.blockSize / 2;
    return new THREE.Vector3(c * this.blockSize + offsetX, 0, r * this.blockSize + offsetZ);
  }

  build() {
    const rows = this.grid.length;
    const cols = this.grid[0].length;
    const offsetX = -(cols * this.blockSize) / 2 + this.blockSize / 2;
    const offsetZ = -(rows * this.blockSize) / 2 + this.blockSize / 2;

    const floorTexture = this.textureLoader.load(Config.TEXTURES.floor);
    floorTexture.wrapS = THREE.RepeatWrapping;
    floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(cols, rows); // Dinâmico, baseado no grid

    const floorGeo = new THREE.PlaneGeometry(cols * this.blockSize, rows * this.blockSize);
    const floorMat = new THREE.MeshStandardMaterial({ 
      map: floorTexture, roughness: 0.7, metalness: 0.1 
    });
    
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    this.scene.add(floor);

    const wallTexture = this.textureLoader.load(Config.TEXTURES.wall);
    wallTexture.wrapS = THREE.RepeatWrapping;
    wallTexture.wrapT = THREE.RepeatWrapping;
    wallTexture.repeat.set(2, 2);

    const wallGeo = new THREE.BoxGeometry(this.blockSize, 4, this.blockSize);
    const wallMat = new THREE.MeshStandardMaterial({ 
      map: wallTexture, roughness: 0.85, metalness: 0.15 
    });

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (this.grid[r][c] === 1) {
          const wall = new THREE.Mesh(wallGeo, wallMat);
          wall.position.set(c * this.blockSize + offsetX, 2, r * this.blockSize + offsetZ);
          wall.castShadow = true;
          wall.receiveShadow = true;
          this.scene.add(wall);
          this.wallsBoxes.push(new THREE.Box3().setFromObject(wall));
        }
      }
    }
  }
}

// ===== Player.js =====

const addMesh = (geo, mat, parent, [x, y, z], [rx, ry, rz] = [0, 0, 0]) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  parent.add(m);
  return m;
};

class Player {
  constructor(scene, levelMap) {
    this.level = levelMap;
    this.group = new THREE.Group();
    this.group.position.copy(this.level.cellToWorld(3, 3));
    scene.add(this.group);
    this.walkTimer = 0;
    this.buildModel();
  }

  buildModel() {
    const { playerSkin: cS, playerClothes: cC, playerLeather: cL, buckle: cB } = Config.COLORS;
    const mat = (c, r) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
    const mEye = new THREE.MeshBasicMaterial({ color: 0x0f0f15 });

    // Tronco e Acessórios
    this.torso = addMesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), mat(cC, 0.8), this.group, [0, 1.4, 0]);
    addMesh(new THREE.BoxGeometry(0.85, 0.12, 0.55), mat(cL, 0.9), this.torso, [0, -0.45, 0]);
    addMesh(new THREE.BoxGeometry(0.15, 0.1, 0.05), mat(cB, 0.4), this.torso, [0, -0.45, 0.29]);

    // Cabeça
    const head = addMesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat(cS, 0.7), this.torso, [0, 1.0, 0]);
    addMesh(new THREE.BoxGeometry(0.1, 0.08, 0.02), mEye, head, [-0.12, 0.1, 0.26]);
    addMesh(new THREE.BoxGeometry(0.1, 0.08, 0.02), mEye, head, [0.12, 0.1, 0.26]);

    // Membros Articulados
    const legGeo = new THREE.BoxGeometry(0.3, 0.9, 0.3).translate(0, -0.45, 0);
    const armGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25).translate(0, -0.4, 0);
    const handGeo = new THREE.BoxGeometry(0.22, 0.22, 0.22);

    this.leftLeg = addMesh(legGeo, mat(cC, 0.8), this.torso, [-0.25, -0.6, 0]);
    this.rightLeg = addMesh(legGeo, mat(cC, 0.8), this.torso, [0.25, -0.6, 0]);
    this.leftArm = addMesh(armGeo, mat(cC, 0.8), this.torso, [-0.55, 0.5, 0]);
    this.rightArm = addMesh(armGeo, mat(cC, 0.8), this.torso, [0.55, 0.5, 0]);
    addMesh(handGeo, mat(cS, 0.7), this.leftArm, [0, -0.85, 0]);
    addMesh(handGeo, mat(cS, 0.7), this.rightArm, [0, -0.85, 0]);

    // Tocha Texturizada e Fonte de Luz
    const tex = new THREE.TextureLoader().load(Config.TEXTURES.wood);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, 2);

    const torch = addMesh(
      new THREE.CylinderGeometry(0.05, 0.06, 0.7),
      new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 }),
      this.rightArm,
      [0, -0.8, 0.3],
      [Math.PI / 4, 0, 0]
    );

    const t = Config.LIGHTS.torch;
    this.torchLight = new THREE.PointLight(t.color, t.intensity, t.distance, t.decay);
    this.torchLight.position.set(0, 0.45, 0);
    this.torchLight.castShadow = true;
    this.torchLight.shadow.bias = -0.0005;
    torch.add(this.torchLight);
  }

  checkCol(pos) {
    const box = new THREE.Box3().setFromCenterAndSize(pos.clone().setY(1), new THREE.Vector3(1.1, 1.8, 1.1));
    return this.level.wallsBoxes.some(w => w.intersectsBox(box));
  }

  update(deltaTime) {
    const mx = Input.isPressed('d') - Input.isPressed('a');
    const mz = Input.isPressed('s') - Input.isPressed('w');

    if (mx !== 0 || mz !== 0) {
      const vec = new THREE.Vector3(mx, 0, mz).normalize().multiplyScalar(Config.PLAYER.speed * deltaTime);
      const pos = this.group.position;

      if (!this.checkCol(pos.clone().add(new THREE.Vector3(vec.x, 0, 0)))) pos.x += vec.x;
      if (!this.checkCol(pos.clone().add(new THREE.Vector3(0, 0, vec.z)))) pos.z += vec.z;

      this.group.rotation.y = Math.atan2(vec.x, vec.z);
      this.walkTimer += deltaTime * 10;
    } else {
      this.walkTimer = 0;
    }

    const w = this.walkTimer;
    this.leftLeg.rotation.x = Math.sin(w) * 0.7;
    this.rightLeg.rotation.x = -Math.sin(w) * 0.7;
    this.leftArm.rotation.x = -Math.sin(w) * 0.6;
    this.rightArm.rotation.x = Math.sin(w) * 0.3;

    // Oscilação física da tocha (flicker)
    if (Config.LIGHTS.torch.flicker && this.torchLight.visible) {
      this.torchLight.intensity = Config.LIGHTS.torch.intensity +
        Math.sin(Date.now() * 0.015) * 0.35 +
        Math.cos(Date.now() * 0.03) * 0.15;
    }
  }
}

    const golemMat = new THREE.MeshStandardMaterial({ 
      map: golemTexture,
      roughness: 0.9, 
      metalness: 0.2 
    });

    this.torso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.8, 1.0), golemMat);
    this.torso.position.y = 2.0;
    this.torso.castShadow = true;
    this.torso.receiveShadow = true;
    this.group.add(this.torso);

    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xe53e3e });
    const eyeLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.1), eyeMat);
    eyeLeft.position.set(-0.35, 0.4, 0.52);
    this.torso.add(eyeLeft);

    const eyeRight = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.1), eyeMat);
    eyeRight.position.set(0.35, 0.4, 0.52);
    this.torso.add(eyeRight);

    const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.25), new THREE.MeshBasicMaterial({ color: 0xe53e3e }));
    core.position.set(0, 0.05, 0.55);
    this.torso.add(core);
    this.core = core;

    const armGeo = new THREE.BoxGeometry(0.5, 1.4, 0.5);
    armGeo.translate(0, -0.7, 0);

    this.leftArm = new THREE.Mesh(armGeo, golemMat);
    this.leftArm.position.set(-1.1, 0.6, 0);
    this.leftArm.castShadow = true;
    this.torso.add(this.leftArm);

    this.rightArm = new THREE.Mesh(armGeo, golemMat);
    this.rightArm.position.set(1.1, 0.6, 0);
    this.rightArm.castShadow = true;
    this.torso.add(this.rightArm);

    const legGeo = new THREE.BoxGeometry(0.6, 1.0, 0.7);
    legGeo.translate(0, -0.5, 0);

    this.leftLeg = new THREE.Mesh(legGeo, golemMat);
    this.leftLeg.position.set(-0.5, -0.9, 0);
    this.leftLeg.castShadow = true;
    this.torso.add(this.leftLeg);

    this.rightLeg = new THREE.Mesh(legGeo, golemMat);
    this.rightLeg.position.set(0.5, -0.9, 0);
    this.rightLeg.castShadow = true;
    this.torso.add(this.rightLeg);
  }

  update(deltaTime) {
    this.animationTimer += deltaTime * 2.5;
    this.torso.position.y = 2.0 + Math.sin(this.animationTimer * 1.2) * 0.15;
    this.leftArm.rotation.x = Math.sin(this.animationTimer) * 0.4;
    this.rightArm.rotation.x = -Math.sin(this.animationTimer) * 0.4;
    if (this.core) this.core.rotation.y += deltaTime * 1.5;
  }
}

// Setup de Entrada e Cena
Input.init();
const scene = new THREE.Scene();
scene.background = new THREE.Color(Config.COLORS.background);
scene.fog = new THREE.FogExp2(Config.COLORS.fog, 0.03);

const camera = new THREE.PerspectiveCamera(
  Config.CAMERA.fov,
  window.innerWidth / window.innerHeight,
  Config.CAMERA.near,
  Config.CAMERA.far
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if (THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;

// Mapeamento de tom cinematográfico para controle de brilho e contraste
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = Config.LIGHTS.exposure;

document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Instanciação dos Sistemas
const lightManager = new LightManager(scene);
const level = new LevelMap(scene);
level.build();

const player = new Player(scene, level);
const guardian = new Guardian(scene, new THREE.Vector3(0, 0, -4));
const cameraManager = new CameraManager(camera, player);

// HUD / Toggles de Demonstração
function updateUI() {
  const modes = { 1: "Terceira Pessoa", 2: "Top-Down (Tática)", 3: "Primeira Pessoa" };
  document.getElementById('ui-cam').innerText = modes[cameraManager.mode];

  const updateLuz = (id, lightObj) => {
    const el = document.getElementById(id);
    el.innerText = lightObj.visible ? "ON" : "OFF";
    el.className = lightObj.visible ? "status-on" : "status-off";
  };
  updateLuz('ui-l1', lightManager.ambientLight);
  updateLuz('ui-l2', lightManager.hemiLight);
  updateLuz('ui-l3', lightManager.moonLight);
  updateLuz('ui-l4', player.torchLight);
}

window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'c') cameraManager.toggleMode();
  if (key === '1') lightManager.toggle('ambient');
  if (key === '2') lightManager.toggle('hemi');
  if (key === '3') lightManager.toggle('moon');
  if (key === '4') player.torchLight.visible = !player.torchLight.visible;
  updateUI();
});

// Game Loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const deltaTime = Math.min(clock.getDelta(), 0.1);

  player.update(deltaTime);
  guardian.update(deltaTime);
  cameraManager.update();

  renderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
